# Evidence for webdriverio/webdriverio#15686, which was CLOSED as not reproducible.
#
# The claim was that `autoXvfb: false` does not stop the worker being spawned through
# xvfb-run. It was filed from the CI logs of a real suite, where ConfigParser resolved
# the flag to false and the runner still logged shouldRun=true for every worker.
#
# It does not reproduce. Every cell below honours the flag. Each varies one way a real
# config can differ from a minimal one: module system, an object mutated by a second
# file before export, a stub service that mutates config in onPrepare, a real
# third-party service, the cucumber framework, a dotted --cucumberOpts.* argument, and
# a plain --logLevel override.
#
# Kept so the negative result is reproducible too, and so it flips by itself if some
# future release ever does lose the flag.
#
# Runs on ubuntu-24.04 on purpose: there xvfb-run still carries the IPC fd, so #15685
# does not fire and the only thing on show is which worker path was chosen. The
# session itself always fails and that is beside the point — the decision is logged
# before any session is created.

name: issue 15686 - autoXvfb (not reproducible)

on:
  push:
  workflow_dispatch:

jobs:
  variant:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: esm-plain,        config: esm-plain.conf.js,     args: "" }
          - { name: cjs-shared,       config: cjs-shared.conf.cjs,   args: "" }
          - { name: esm-service,      config: esm-service.conf.js,   args: "" }
          - { name: esm-bs-service,   config: esm-bs-service.conf.js, args: "" }
          - { name: cucumber-noargs,  config: cucumber.conf.js,      args: "" }
          - { name: cucumber-cli-tags, config: cucumber.conf.js,     args: "--cucumberOpts.tags=@smoke" }
          - { name: esm-cli-loglevel, config: esm-plain.conf.js,     args: "--logLevel info" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: issue-15686
        run: npm install --no-audit --no-fund

      - name: Versions
        working-directory: issue-15686
        run: |
          for p in cli local-runner xvfb config browserstack-service; do
            echo "@wdio/$p: $(node -p "try{require('./node_modules/@wdio/$p/package.json').version}catch(e){'ABSENT'}")"
          done

      - name: What ConfigParser resolves
        working-directory: issue-15686
        run: |
          node --input-type=module -e "
            import { ConfigParser } from '@wdio/config/node'
            const cp = new ConfigParser('./variants/${{ matrix.config }}')
            await cp.initialize()
            console.log('RESOLVED autoXvfb =', JSON.stringify(cp.getConfig().autoXvfb))
          "

      - name: Run wdio
        working-directory: issue-15686
        run: |
          echo "DISPLAY is '${DISPLAY:-}' (empty is what makes shouldRun() fire)"
          # The session always fails here and that is not what is being measured, so
          # never let it fail the step. Redirect rather than pipe, so nothing depends
          # on how the logger writes.
          set +e
          npx wdio run ./variants/${{ matrix.config }} ${{ matrix.args }} > wdio.log 2>&1
          echo "wdio exited $? ($(wc -l < wdio.log) lines captured)"
          set -e

      - name: Which worker path was chosen
        working-directory: issue-15686
        run: |
          echo "--- ProcessFactory decisions:"
          grep -E "ProcessFactory:|Skipping automatic Xvfb" wdio.log || echo "(none found)"
          echo
          if grep -q "shouldRun=true" wdio.log; then
            echo "RESULT ${{ matrix.name }}: FLAG LOST - xvfb-run wrapper chosen despite autoXvfb false"
          elif grep -q "shouldRun=false" wdio.log; then
            echo "RESULT ${{ matrix.name }}: flag honoured - regular fork"
          else
            echo "RESULT ${{ matrix.name }}: INCONCLUSIVE - no ProcessFactory line, worker may never have spawned"
          fi
