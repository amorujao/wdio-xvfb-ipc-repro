# Narrows down webdriverio/webdriverio#15686.
#
# A minimal ESM project honours `autoXvfb: false` — the run logs
# `shouldRun=false` and `Creating worker process with regular fork`. A real suite
# with the same flag and the same 9.32.0 packages logs `shouldRun=true` and takes
# the xvfb-run wrapper instead. This matrix changes one trait at a time to find
# which of them loses the flag:
#
#   esm-plain      control, known good
#   cjs-shared     CommonJS, and an object mutated by a second file before export
#   esm-service    a launcher service that mutates config in onPrepare
#
# Runs on ubuntu-24.04 so #15685 stays out of the way: there xvfb-run still carries
# the IPC fd, so the worker survives and the only thing on show is which path was
# chosen. The session itself always fails (no display, no real device) and that is
# fine — the decision is logged before any session is created.

name: issue 15686 - which config trait loses autoXvfb

on:
  push:
  workflow_dispatch:

jobs:
  variant:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        variant:
          - esm-plain.conf.js
          - cjs-shared.conf.cjs
          - esm-service.conf.js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: issue-15686
        run: npm install --no-audit --no-fund

      - name: Versions
        working-directory: issue-15686
        run: |
          for p in cli local-runner xvfb config; do
            echo "@wdio/$p: $(node -p "try{require('./node_modules/@wdio/$p/package.json').version}catch(e){'ABSENT'}")"
          done

      - name: What ConfigParser resolves
        working-directory: issue-15686
        run: |
          node --input-type=module -e "
            import { ConfigParser } from '@wdio/config/node'
            const cp = new ConfigParser('./variants/${{ matrix.variant }}')
            await cp.initialize()
            console.log('RESOLVED autoXvfb =', JSON.stringify(cp.getConfig().autoXvfb))
          "

      - name: Run wdio
        working-directory: issue-15686
        run: |
          echo "DISPLAY is '${DISPLAY:-}' (empty is what makes shouldRun() fire)"
          # The session always fails here and that is not what is being measured, so
          # never let it fail the step. Redirect rather than pipe, so nothing depends
          # on how the logger writes.
          set +e
          npx wdio run ./variants/${{ matrix.variant }} > wdio.log 2>&1
          echo "wdio exited $? ($(wc -l < wdio.log) lines captured)"
          set -e

      - name: Which worker path was chosen
        working-directory: issue-15686
        run: |
          echo "--- ProcessFactory decisions:"
          grep -E "ProcessFactory:|Skipping automatic Xvfb" wdio.log || echo "(none found)"
          echo
          if grep -q "shouldRun=true" wdio.log; then
            echo "RESULT ${{ matrix.variant }}: FLAG LOST - xvfb-run wrapper chosen despite autoXvfb false"
          elif grep -q "shouldRun=false" wdio.log; then
            echo "RESULT ${{ matrix.variant }}: flag honoured - regular fork"
          else
            echo "RESULT ${{ matrix.variant }}: INCONCLUSIVE - no ProcessFactory line, worker may never have spawned"
          fi
